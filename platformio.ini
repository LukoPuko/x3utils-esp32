; x3utils-esp32 — standalone ESP32 SWD programmer for AT32F415 X3 VCUs,
; controlled from any phone/desktop browser over WiFi.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
;
; The classic ESP32 dev board is the default target. S3/C3/S2 variants are
; provided as extra environments; pick the one that matches your board.

[platformio]
default_envs = esp32dev

[common]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    ; Async web server + TCP stack. These forks are the maintained ones that
    ; build cleanly against current Arduino-ESP32 cores.
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.2.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = huge_app.csv
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
lib_deps = ${common.lib_deps}

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = huge_app.csv
build_flags = ${common.build_flags} -DX3_BOARD_S3
build_unflags = ${common.build_unflags}
lib_deps = ${common.lib_deps}

; The X3-Tuner PCB in hardware/: ESP32-C3-WROOM-02-N4 (4 MB flash), battery,
; switchable VCU supply. Flashes over its own USB-C port (the C3's native
; USB-Serial/JTAG, no USB-UART chip) — hold BOOT while pressing RESET if the
; port does not show up.
[env:x3tuner]
platform = espressif32
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = huge_app.csv
build_flags = ${common.build_flags} -DX3_BOARD_TUNER
    -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = ${common.build_unflags}
lib_deps = ${common.lib_deps}

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = huge_app.csv
build_flags = ${common.build_flags} -DX3_BOARD_C3
build_unflags = ${common.build_unflags}
lib_deps = ${common.lib_deps}
